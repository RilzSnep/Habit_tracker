name: CI/CD Pipeline
on:
  push:
    branches:
      - master
      - feature/homework-ci-cd
  pull_request:
    branches:
      - master
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install Python venv
        run: |
          sudo apt update
          sudo apt install -y python3.12-venv
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Run linting with flake8
        run: |
          echo "python3 -m pip install flake8"
          echo "flake8 . --max-line-length=200 --exclude=venv,.git,__pycache__"
      - name: Apply migrations
        env:
          DJANGO_SETTINGS_MODULE: habit_tracker.settings
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ":memory:"
          DB_USER: ""
          DB_PASSWORD: ""
          DB_HOST: ""
          DB_PORT: ""
          SECRET_KEY: "test-secret-key"
          TELEGRAM_BOT_TOKEN: "test-token"
        run: |
          python3 manage.py makemigrations
          python3 manage.py migrate
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: habit_tracker.settings
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ":memory:"
          DB_USER: ""
          DB_PASSWORD: ""
          DB_HOST: ""
          DB_PORT: ""
          SECRET_KEY: "test-secret-key"
          TELEGRAM_BOT_TOKEN: "test-token"
          CELERY_TASK_ALWAYS_EAGER: "True"
          CELERY_TASK_EAGER_PROPAGATES: "True"
        run: |
          python3 manage.py test habits.tests
          python3 manage.py test users.tests
  build-and-deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - name: Build and push Docker images
        run: |
          docker-compose -f docker-compose.yml build
          docker tag habit_tracker-web:latest rilzsnep/habit_tracker-web:latest
          docker tag habit_tracker-celery:latest rilzsnep/habit_tracker-celery:latest
          docker push rilzsnep/habit_tracker-web:latest
          docker push rilzsnep/habit_tracker-celery:latest
      - name: Debug SSH Key
        run: |
          echo "SSH Key presence check: ${{ secrets.SERVER_SSH_KEY != '' && 'Key exists' || 'Key is empty' }}"
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /home/rilzsnep/habit_tracker
            git pull origin master
            docker-compose -f docker-compose.yml down
            docker-compose -f docker-compose.yml pull
            docker-compose -f docker-compose.yml up -d
        env:
          DEBUG: true
